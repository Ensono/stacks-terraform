---
variables:
  - name: VERSION_NUMBER
    value: $(Build.BuildNumber)
  - name: COMMIT_ID
    value: $(Build.SourceVersion)
  - name: OWNER
    value: ensono
  - name: REPOSITORY
    value: stacks-terraform
  - name: ARTIFACTS_DIR
    value: artifacts/
  - group: release-github-credentials
  # Group should contain:
  # GITHUB_APP_ID
  # GITHUB_APP_INSTALLATION_ID
  # GITHUB_APP_PRIVATE_KEY_BASE64 (secret; base64-encoded PEM private key)
